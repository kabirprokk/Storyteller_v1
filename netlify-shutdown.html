<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Storyteller has moved</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0b0b;color:#f4f1e9;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}.card{width:min(620px,100%);padding:48px 32px;border:1px solid #ffffff22;border-radius:24px;background:#121212;box-shadow:0 24px 80px #0008}h1{margin:0 0 16px;font:400 clamp(42px,8vw,72px)/1 Georgia,serif}p{margin:0 auto 28px;color:#b7b3ab;max-width:460px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;background:#f4f1e9;color:#0b0b0b;font-weight:700;text-decoration:none}.button:hover{background:#d66b41;color:#fff}.small{margin-top:22px;font-size:13px;color:#77736d}
  </style>
</head>
<body>
  <main class="card">
    <h1>Storyteller has moved.</h1>
    <p>This website is shut down at this address. Visit our new official website to read and share stories.</p>
    <a class="button" href="https://storyteller-page-v1.vercel.app/">Go to the new Storyteller website →</a>
    <p class="small">New URL: storyteller-page-v1.vercel.app</p>
  </main>

</html>
